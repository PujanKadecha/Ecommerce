name: E-Commerce CI Pipeline

# Trigger the workflow on pushes or pull requests to main or master
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    # Set working directory to your backend folder
    defaults:
      run:
        working-directory: ./backend

    # Spin up a live Redis container service for the test environment
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Pull the repo code into the GitHub runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js runtime
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      # 3. Clean install backend dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Run automated Jest tests
      - name: Run Jest Test Suite
        env:
          NODE_ENV: test
          PORT: 5001
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: ci_test_access_secret_12345
          JWT_ACCESS_EXPIRES: 15m
          JWT_REFRESH_SECRET: ci_refresh_secret
          JWT_REFRESH_EXPIRES: 7d
        run: npm test --if-present

  frontend-build:
    name: Frontend Lint & Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      # Checks that Vite can build the production assets without syntax errors
      - name: Build Frontend (Vite)
        run: npm run build